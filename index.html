function profile(){const own=state.posts.filter(p=>p.author===state.user.nickname);return `${demoStrip()}<div class="profile-hero"><div class="profile-row">${avatar(state.user.nickname)}<div class="profile-info"><h2>${esc(state.user.nickname)}</h2><p>Perfil CIFRA · membro da comunidade</p></div></div><div class="stats"><div class="stat"><strong>${own.length}</strong><span>Relatos</span></div><div class="stat"><strong>12</strong><span>Seguidores*</span></div><div class="stat"><strong>${state.follows.length}</strong><span>Seguindo*</span></div></div><div class="profile-actions"><button class="secondary" data-action="edit-profile">Editar perfil</button><button class="secondary" data-action="contact-admin">${I('mail')} Contactar ADM</button></div><p class="small muted" style="margin:12px 0 0">* Números ilustrativos da prévia. A lista de seguidores não é exibida.</p></div><div class="segmented"><button class="${state.profileTab==='relatos'?'active':''}" data-profile-tab="relatos">Meus relatos</button><button class="${state.profileTab==='curtidos'?'active':''}" data-profile-tab="curtidos">Curtidos</button></div>${state.profileTab==='relatos'?(own.length?`<div class="feed-row">${own.map(card).join('')}</div>`:`<div class="empty-state">${I('mic')}<br>Seus relatos publicados vão aparecer aqui.<br><button class="text-link" data-nav="record">Gravar primeiro relato</button></div>`):`<div class="empty-state">${I('heart')}<br>Os relatos que você curtir aparecerão aqui depois da integração.</div>`}<div class="settings-card"><div class="row-between"><div><strong style="font-size:12px">Conta de demonstração</strong><div class="small muted" style="margin-top:5px">Não é uma conta real nem está autenticada.</div></div><button class="danger-btn" data-action="logout">Sair</button></div></div>`}
function content(){switch(state.screen){case'explore':return explore();case'record':return record();case'following':return following();case'profile':return profile();default:return home()}}
function render(){if(!state.user){root.innerHTML=authView();return}root.innerHTML=`<div class="app-wrap">${topbar()}<main id="mainContent">${content()}</main></div>${nav()}`;wireAudioPlayers()}
function authView(){return `<main class="auth-wrap"><section class="auth-card">${`<div class="auth-logo">${logo()}</div>`}<h1>${state.authMode==='signup'?'Sua voz tem lugar aqui.':'Que bom te ver de novo.'}</h1><p class="auth-sub">Entre no CIFRA com nickname e senha. Sem e-mail ou telefone.</p><div class="auth-note"><strong>Prévia local:</strong> este protótipo não autentica de verdade. Não use sua senha real; nenhum campo de senha é salvo ou enviado.</div><form id="authForm"><div class="form-grid"><div class="field"><label for="nickname">Nickname</label><input id="nickname" name="nickname" minlength="2" maxlength="24" placeholder="Como vão te chamar?" autocomplete="nickname" required></div><div class="field"><label for="password">Senha de teste</label><input id="password" name="password" type="password" minlength="8" placeholder="Mínimo de 8 caracteres" autocomplete="${state.authMode==='signup'?'new-password':'current-password'}" required></div>${state.authMode==='signup'?`<div class="field"><label>Escolha temas para o seu feed</label><div class="interest-picks">${cats.map(c=>`<label><input type="checkbox" name="interest" value="${c[0]}" ${state.interests.includes(c[0])?'checked':''}>${c[1]}</label>`).join('')}</div></div>`:''}</div><p class="auth-error" id="authError"></p><button class="primary wide" type="submit">${state.authMode==='signup'?'Criar prévia local':'Entrar na prévia'}</button></form><div class="auth-switch">${state.authMode==='signup'?'Já criou uma prévia?':'Ainda não tem uma prévia?'} <button data-action="auth-switch">${state.authMode==='signup'?'Entrar':'Criar prévia'}</button></div><div class="divider"></div><div class="feature-list"><div class="feature">${I('wave')} Relatos em áudio com efeitos locais</div><div class="feature">${I('shield')} Áudios privados para seguidores</div><div class="feature">${I('spark')} Um feed feito para descobrir novas vozes</div></div><p class="small muted" style="text-align:center;margin:0">CIFRA · RELATOS &amp; SEGREDOS</p></section></main>`}
function openModal(html){const old=root.querySelector('.modal-backdrop');if(old)old.remove();root.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" data-backdrop><section class="modal" role="dialog" aria-modal="true">${html}</section></div>`)}
function closeModal(){document.querySelector('.modal-backdrop')?.remove();state.modal=null}
function commentsModal(id){const post=state.posts.find(p=>p.id===id);if(!post)return;const items=state.comments[id]||[];openModal(`<div class="modal-head"><h3>Comentários</h3><button class="modal-close" data-action="close-modal" aria-label="Fechar">${I('close')}</button></div><p class="small muted" style="margin:-5px 0 14px">${esc(post.title)} · ${post.comments_enabled===false?'Comentários desativados':'texto e emojis'}</p>${post.comments_enabled===false?`<div class="empty-state">O criador desativou os comentários deste relato.</div>`:`<div class="comment-list">${items.length?items.map(c=>`<div class="comment"><div class="author-avatar">${esc(initials(c.name))}</div><div class="comment-body"><strong>${esc(c.name)}</strong><p>${esc(c.text)}</p></div></div>`).join(''):`<div class="empty-state">Ainda não há comentários. Seja a primeira pessoa a comentar.</div>`}</div><form id="commentForm" class="comment-form" data-post="${esc(id)}"><input name="body" maxlength="2000" placeholder="Escreva um comentário…" required><button class="primary" type="submit">Enviar</button></form><div class="small muted" style="margin-top:8px">Comentários são somente texto e emojis.</div>`}`)}
function contactModal(){openModal(`<div class="modal-head"><h3>Contactar ADM CIFRA</h3><button class="modal-close" data-action="close-modal" aria-label="Fechar">${I('close')}</button></div><p class="screen-sub" style="margin:0 0 14px">Use este canal para dúvidas, denúncias ou parcerias relevantes. Não é uma conversa entre usuários.</p><form id="contactForm" class="form-grid"><div class="field"><label for="contactTopic">Assunto</label><select id="contactTopic" name="topic"><option value="duvida">Dúvida</option><option value="denuncia">Denúncia</option><option value="parceria">Parceria</option></select></div><div class="field"><label for="contactSubject">Título</label><input id="contactSubject" name="subject" maxlength="160" placeholder="Resuma o assunto" required></div><div class="field"><label for="contactBody">Mensagem</label><textarea id="contactBody" name="body" maxlength="5000" placeholder="Explique com clareza…" required></textarea></div><p class="notice">Prévia local: a mensagem não será enviada ao ADM até a integração do backend.</p><button class="primary wide" type="submit">Enviar na prévia</button></form>`)}
function editProfileModal(){openModal(`<div class="modal-head"><h3>Editar perfil</h3><button class="modal-close" data-action="close-modal">${I('close')}</button></div><form id="profileForm" class="form-grid"><div class="field"><label for="editNickname">Nickname</label><input id="editNickname" name="nickname" maxlength="24" minlength="2" value="${esc(state.user.nickname)}" required></div><div class="field"><label for="avatarFile">Foto de perfil (opcional)</label><input id="avatarFile" type="file" accept="image/*"></div><button class="primary wide" type="submit">Salvar na prévia</button><p class="notice">A alteração é local nesta versão de demonstração.</p></form>`)}
function wireAudioPlayers(){document.querySelectorAll('audio[id^="audio-"]').forEach(a=>wireAudio(a,a.id.slice(6)));const p=document.getElementById('previewAudio');if(p)wireAudio(p,'preview')}
function wireAudio(audio,id){const prefix=id==='preview'?'preview':'audio';const btn=id==='preview'?document.querySelector('[data-preview-play]'):document.querySelector(`[data-play="${CSS.escape(id)}"]`);const seek=id==='preview'?document.querySelector('[data-preview-seek]'):document.querySelector(`[data-seek="${CSS.escape(id)}"]`);const time=id==='preview'?document.querySelector('[data-preview-time]'):document.querySelector(`[data-time="${CSS.escape(id)}"]`);const speed=id==='preview'?document.querySelector('[data-preview-speed]'):document.querySelector(`[data-speed="${CSS.escape(id)}"]`);if(!btn||!seek||!time)return;btn.onclick=()=>{if(audio.paused)audio.play().catch(()=>showToast('Não foi possível tocar este áudio.'));else audio.pause()};audio.ontimeupdate=()=>{if(audio.duration){seek.value=String((audio.currentTime/audio.duration)*100);time.textContent=stamp(audio.currentTime)}};audio.onended=()=>{btn.innerHTML=I('play')};audio.onplay=()=>{btn.innerHTML=I('pause')};audio.onpause=()=>{btn.innerHTML=I('play')};seek.oninput=()=>{if(audio.duration)audio.currentTime=audio.duration*(Number(seek.value)/100)};if(speed)speed.onchange=()=>audio.playbackRate=Number(speed.value.replace(',','.').replace('x',''))}
function go(screen){state.screen=screen;state.modal=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function createVoiceGraph(ctx,source,dest,effect){let node=source;if(effect==='grave'){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=520;f.Q.value=.8;node.connect(f);node=f}else if(effect==='aguda'){const f=ctx.createBiquadFilter();f.type='highshelf';f.frequency.value=1300;f.gain.value=9;node.connect(f);node=f}else if(effect==='robotica'){const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=950;f.Q.value=.85;const g=ctx.createGain();g.gain.value=.55;const osc=ctx.createOscillator();osc.type='square';osc.frequency.value=42;node.connect(f);f.connect(g);osc.connect(g.gain);osc.start();state.voiceOsc=osc;node=g}else if(effect==='distorcida'){const sh=ctx.createWaveShaper();const curve=new Float32Array(44100);for(let i=0;i<curve.length;i++){const x=i*2/curve.length-1;curve[i]=Math.tanh(4*x)}sh.curve=curve;sh.oversample='4x';node.connect(sh);node=sh}node.connect(dest)}
async function startRecording(){if(state.recording||state.recordingStarting)return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){showToast('Este navegador não oferece gravação de áudio.');return}state.recordingStarting=true;try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});state.mediaStream=stream;const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)throw new Error('AudioContext indisponível');state.audioContext=new AudioContextClass();if(state.audioContext.state==='suspended')await state.audioContext.resume();const src=state.audioContext.createMediaStreamSource(stream);const dest=state.audioContext.createMediaStreamDestination();createVoiceGraph(state.audioContext,src,dest,state.selectedEffect);let opts={};for(const mt of ['audio/webm;codecs=opus','audio/mp4','audio/webm'])if(MediaRecorder.isTypeSupported(mt)){opts.mimeType=mt;break}state.chunks=[];state.recorder=new MediaRecorder(dest.stream,opts);state.recorder.ondataavailable=e=>{if(e.data.size)state.chunks.push(e.data)};state.recorder.onstop=()=>{const blob=new Blob(state.chunks,{type:state.recorder.mimeType||'audio/webm'});if(state.recordedUrl)URL.revokeObjectURL(state.recordedUrl);state.recordedBlob=blob;state.recordedUrl=URL.createObjectURL(blob);state.mediaStream?.getTracks().forEach(t=>t.stop());try{state.voiceOsc?.stop?.()}catch(e){}state.voiceOsc=null;state.audioContext?.close();state.mediaStream=null;state.audioContext=null;state.recording=false;state.recordingStarting=false;clearInterval(state.timer);render();showToast('Gravação pronta para ouvir.')} ;state.recordSeconds=0;state.recordingStarting=false;state.recording=true;state.recorder.start(1000);state.timer=setInterval(()=>{state.recordSeconds++;const t=document.getElementById('recordTimer');if(t)t.textContent=stamp(state.recordSeconds);if(state.recordSeconds>=3600)stopRecording()},1000);render()}catch(e){state.mediaStream?.getTracks().forEach(t=>t.stop());try{state.voiceOsc?.stop?.()}catch(_){}state.voiceOsc=null;try{await state.audioContext?.close()}catch(_){}state.mediaStream=null;state.audioContext=null;state.recording=false;state.recordingStarting=false;clearInterval(state.timer);showToast('Não consegui iniciar a gravação. Confira a permissão do microfone e o suporte a efeitos de áudio.')}}
function stopRecording(){clearInterval(state.timer);if(state.recorder&&state.recorder.state!=='inactive')state.recorder.stop();else{state.recording=false;render()}}
function redoRecording(){if(state.recordedUrl)URL.revokeObjectURL(state.recordedUrl);state.recordedUrl=null;state.recordedBlob=null;state.recordSeconds=0;state.coverUrl=null;render()}
function openNotifications(){openModal(`<div class="modal-head"><h3>Notificações</h3><button class="modal-close" data-action="close-modal">${I('close')}</button></div><div class="empty-state">${I('bell')}<br>As notificações de novos relatos estarão ativas por padrão quando você seguir um criador.<br><span class="small">Nesta prévia, elas ainda não são enviadas.</span></div>`)}
root.addEventListener('click',e=>{const navBtn=e.target.closest('[data-nav]');if(navBtn){go(navBtn.dataset.nav);return}const f=e.target.closest('[data-follow]');if(f){toggleFollow(f.dataset.follow);return}const l=e.target.closest('[data-like]');if(l){toggleLike(l.dataset.like);return}const c=e.target.closest('[data-comments]');if(c){commentsModal(c.dataset.comments);return}const cat=e.target.closest('[data-category]');if(cat){state.selectedCat=cat.dataset.category;state.screen='explore';render();return}const effect=e.target.closest('[data-effect]');if(effect){state.selectedEffect=effect.dataset.effect;root.querySelectorAll('[data-effect]').forEach(b=>b.classList.toggle('active',b.dataset.effect===state.selectedEffect));return}const vis=e.target.closest('[data-visibility]');if(vis){state.publishVisibility=vis.dataset.visibility;root.querySelectorAll('[data-visibility]').forEach(b=>b.classList.toggle('active',b.dataset.visibility===state.publishVisibility));return}const tab=e.target.closest('[data-profile-tab]');if(tab){state.profileTab=tab.dataset.profileTab;render();return}const share=e.target.closest('[data-share]');if(share){if(navigator.share)navigator.share({title:'CIFRA — Relatos & Segredos',text:'Descubra este relato no CIFRA'}).catch(()=>{});else showToast('Compartilhamento será ligado ao perfil público.');return}const act=e.target.closest('[data-action]');if(act){const a=act.dataset.action;if(a==='auth-switch'){state.authMode=state.authMode==='signup'?'login':'signup';render()}else if(a==='start-record')startRecording();else if(a==='stop-record')stopRecording();else if(a==='redo')redoRecording();else if(a==='cover')document.getElementById('coverFile')?.click();else if(a==='toggle-comments'){state.commentsEnabled=state.commentsEnabled===false;act.classList.toggle('on',state.commentsEnabled!==false)}else if(a==='edit-profile')editProfileModal();else if(a==='contact-admin')contactModal();else if(a==='close-modal')closeModal();else if(a==='notifications')openNotifications();else if(a==='logout'){state.user=null;state.authMode='login';safeSave();render()}return}const backdrop=e.target.closest('[data-backdrop]');if(backdrop&&e.target===backdrop)closeModal();});
root.addEventListener('input',e=>{if(e.target.id==='searchInput'){const pos=e.target.selectionStart;state.search=e.target.value;render();const n=document.getElementById('searchInput');n?.focus();n?.setSelectionRange(pos,pos)}});
root.addEventListener('submit',e=>{if(e.target.id==='authForm'){e.preventDefault();const fd=new FormData(e.target);const nickname=String(fd.get('nickname')||'').trim();const password=String(fd.get('password')||'');const err=document.getElementById('authError');if(password.length<8){err.textContent='Use pelo menos 8 caracteres para esta senha de teste.';return}if(nickname.toLowerCase()==='adm cifra'){err.textContent='Esse nickname é reservado ao perfil oficial.';return}if(state.authMode==='login'&&(!state.profile||state.profile.nickname.toLowerCase()!==nickname.toLowerCase())){err.textContent='Nickname não encontrado nesta prévia local. Crie uma prévia primeiro.';return}if(state.authMode==='signup'){state.user={nickname};state.profile=state.user;state.interests=fd.getAll('interest');if(!state.interests.length)state.interests=['relatos']}else{state.user=state.profile}safeSave();state.screen='home';render();showToast('Prévia local aberta. Nenhuma senha foi salva.');return}if(e.target.id==='publishForm'){e.preventDefault();const fd=new FormData(e.target);const title=String(fd.get('title')||'').trim();if(!state.recordedBlob){showToast('Grave um áudio antes de publicar.');return}const id='local-'+Date.now();const post={id,author:state.user.nickname,initials:initials(state.user.nickname),category:String(fd.get('category')||'relatos'),title,description:String(fd.get('description')||''),duration:state.recordSeconds,visibility:state.publishVisibility||'public',comments_enabled:state.commentsEnabled!==false,likes:0,comments:0,cover:'cover-violet',coverUrl:state.coverUrl,audioUrl:state.recordedUrl,blob:state.recordedBlob,createdAt:'Agora · prévia local',createdAtSort:Date.now(),demo:false};state.posts.unshift(post);state.recordedUrl=null;state.recordedBlob=null;state.recordSeconds=0;state.coverUrl=null;state.screen='home';safeSave();render();showToast('Publicado nesta prévia local. O backend ainda não está conectado.');return}if(e.target.id==='commentForm'){e.preventDefault();const fd=new FormData(e.target);const id=e.target.dataset.post;state.comments[id]=state.comments[id]||[];state.comments[id].push({name:state.user.nickname,text:String(fd.get('body')||'').trim()});safeSave();commentsModal(id);showToast('Comentário adicionado à prévia.');return}if(e.target.id==='contactForm'){e.preventDefault();closeModal();showToast('Registrado só nesta prévia; ainda não chegou ao ADM.');return}if(e.target.id==='profileForm'){e.preventDefault();const fd=new FormData(e.target);const n=String(fd.get('nickname')||'').trim();if(n.toLowerCase()==='adm cifra'){showToast('Esse nickname é reservado ao perfil oficial.');return}const input=document.getElementById('avatarFile');if(input?.files?.[0]){const file=input.files[0];if(file.size>2*1024*1024){showToast('Escolha uma imagem menor que 2 MB.');return}const reader=new FileReader();reader.onload=()=>{state.avatarData=reader.result;finishProfile(n)};reader.readAsDataURL(file)}else finishProfile(n);return}});
function finishProfile(n){const old=state.user.nickname;state.user.nickname=n;state.profile=state.user;state.posts.forEach(p=>{if(p.author===old)p.author=n});safeSave();closeModal();render();showToast('Perfil atualizado nesta prévia.')}
root.addEventListener('change',e=>{if(e.target.id==='coverFile'){const file=e.target.files?.[0];if(!file)return;if(file.size>5*1024*1024){showToast('A capa deve ter até 5 MB.');return}if(state.coverUrl)URL.revokeObjectURL(state.coverUrl);state.coverUrl=URL.createObjectURL(file);const box=e.target.closest('.field');let img=box?.querySelector('.preview-cover');if(!img&&box){img=document.createElement('img');img.className='preview-cover';img.alt='Prévia da capa';box.appendChild(img)}if(img)img.src=state.coverUrl} });
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
